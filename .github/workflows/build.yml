name: Build e testes

# Roda a cada push na branch main e também sob demanda (botão "Run workflow" na aba Actions).
# Serve para provar que o projeto compila e que os testes passam numa máquina limpa,
# que é exatamente a situação de quem baixa o repositório pela primeira vez.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # Versão fixa (e não "ubuntu-latest") para o build não mudar de ambiente sozinho.
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      # O projeto pede toolchain JDK 25 (gradle/gradle-daemon-jvm.properties).
      - name: Instalar o JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # O Android SDK ja vem instalado nas maquinas do GitHub (ANDROID_HOME).
      # Aqui so aceitamos as licencas, para o Gradle poder baixar a plataforma que faltar.
      # O "|| true" evita falhar por causa do SIGPIPE do comando "yes".
      - name: Aceitar licencas do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Permitir executar o gradlew
        run: chmod +x gradlew

      - name: Rodar testes unitarios e compilar o app (debug)
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Guardar relatorio dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-testes
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Guardar o APK para instalar no celular
        uses: actions/upload-artifact@v4
        with:
          name: media-tracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
