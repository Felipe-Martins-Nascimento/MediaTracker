name: Build e testes

# Roda a cada push na branch main e também sob demanda (botão "Run workflow" na aba Actions).
# Serve para provar que o projeto compila e que os testes passam numa máquina limpa,
# que é exatamente a situação de quem baixa o repositório pela primeira vez.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # Versão fixa (e não "ubuntu-latest") para o build não mudar de ambiente sozinho.
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      # O projeto pede toolchain JDK 25 (gradle/gradle-daemon-jvm.properties).
      - name: Instalar o JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # O Android SDK ja vem instalado nas maquinas do GitHub (ANDROID_HOME).
      # Aqui so aceitamos as licencas, para o Gradle poder baixar a plataforma que faltar.
      # O "|| true" evita falhar por causa do SIGPIPE do comando "yes".
      - name: Aceitar licencas do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Permitir executar o gradlew
        run: chmod +x gradlew

      # A saida do Gradle vai para build.log (e tambem aparece no log do passo),
      # para o passo seguinte conseguir resumir o erro caso o build falhe.
      - name: Rodar testes unitarios e compilar o app (debug)
        run: |
          set +e
          ./gradlew testDebugUnitTest assembleDebug --stacktrace --console=plain > build.log 2>&1
          status=$?
          cat build.log
          exit $status

      # Se o build falhar, publica um resumo do erro como "anotacao" na pagina da execucao
      # (aparece no topo da pagina, sem precisar abrir o log inteiro).
      - name: Resumir o erro
        if: failure()
        run: |
          python3 - <<'PY'
          lines = open('build.log', encoding='utf-8', errors='replace').read().splitlines()
          parts = []
          kotlin = [l for l in lines if l.startswith('e: ')][:8]
          if kotlin:
              parts.append('ERROS DE CODIGO:\n' + '\n'.join(kotlin))
          failed = [l.strip() for l in lines if l.strip().endswith(' FAILED')][:8]
          if failed:
              parts.append('TESTES QUE FALHARAM:\n' + '\n'.join(failed))
          for i, l in enumerate(lines):
              if 'What went wrong' in l:
                  parts.append('\n'.join(lines[i:i + 9]))
                  break
          if not parts:
              parts.append('ULTIMAS LINHAS:\n' + '\n'.join(lines[-15:]))
          text = '\n\n'.join(parts)[:3500]
          text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print('::error title=Resumo do erro::' + text)
          PY

      - name: Guardar relatorio dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-testes
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Guardar o APK para instalar no celular
        uses: actions/upload-artifact@v4
        with:
          name: media-tracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk